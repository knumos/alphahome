<!DOCTYPE html>
<html lang="es" data-theme="cyan">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Entrenamiento de fuerza en casa personalizable con temporizadores persistentes, doble progresión inteligente y guías técnicas 3D offline." />
  <meta name="theme-color" content="#070b14" />
  <meta name="application-name" content="AlphaHome" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AlphaHome" />
  <title>AlphaHome — Entrenamiento de Fuerza en Casa</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Cdefs%3E%3ClinearGradient id='bg' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%2306b6d4'/%3E%3Cstop offset='100%25' stop-color='%232563eb'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='512' height='512' rx='112' fill='%23070b14'/%3E%3Crect x='24' y='24' width='464' height='464' rx='96' fill='url(%23bg)'/%3E%3Cpath d='M276 96L136 278h104l-14 138 150-192H272l4-128z' fill='%23ffffff'/%3E%3C/svg%3E" />
  <link rel="apple-touch-icon" sizes="192x192" href="./icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="./icons/icon-512.png" />
  <link rel="manifest" href="./manifest.webmanifest" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="./css/styles.css" />
</head>
<body>

  <!-- Banner de Alerta Visual cuando termina el descanso -->
  <div id="rest-alert-banner" class="rest-alert-banner hidden" role="alert">
    <div class="rest-alert-banner__inner">
      <div class="row gap-3 min-w-0">
        <span class="icon-btn" style="background:rgba(3,34,25,0.16);color:#032219" aria-hidden="true">🔔</span>
        <div class="min-w-0">
          <p class="text-xs uppercase font-extrabold">¡Descanso terminado!</p>
          <p id="rest-alert-subtitle" class="text-xs font-semibold truncate">Listo para tu siguiente serie</p>
        </div>
      </div>
      <button type="button" class="btn btn--xs" style="background:#032219;color:#34d399" data-action="dismiss-rest-alert">
        Entendido
      </button>
    </div>
  </div>

  <!-- Contenedor de Toasts -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Barra Superior Fija -->
  <header class="app-header">
    <div class="app-header__inner">
      <div class="row gap-2.5 min-w-0">
        <div class="brand-badge shrink-0" aria-hidden="true">
          <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
        </div>
        <div class="min-w-0">
          <h1 id="header-title" class="brand-title truncate">AlphaHome</h1>
          <p id="header-subtitle" class="brand-subtitle truncate">Fuerza en Casa</p>
        </div>
      </div>

      <div id="header-right" class="row gap-2 shrink-0"></div>
    </div>

    <!-- Barra de progreso de sesión activa -->
    <div id="session-progress-bar-wrap" class="session-bar hidden">
      <div class="session-bar__meta">
        <span id="session-timer-label" class="font-semibold text-accent tabular-nums">00:00 / 60:00</span>
        <span id="wake-lock-indicator" class="hidden font-semibold text-emerald">Pantalla activa</span>
        <span id="session-sets-progress" class="font-medium text-muted tabular-nums">0 / 0 series</span>
      </div>
      <div class="progress-track">
        <div id="session-progress-fill" class="progress-fill"></div>
      </div>
    </div>
  </header>

  <!-- Contenido Dinámico -->
  <main id="app-main" class="app-main"></main>

  <!-- Widget Flotante del Temporizador de Descanso -->
  <div id="rest-timer-widget" class="rest-widget hidden">
    <div class="rest-widget__card">
      <div class="row-between gap-3 mb-2">
        <div class="min-w-0">
          <div class="row gap-2">
            <span class="pulse-dot" aria-hidden="true"></span>
            <span class="text-2xs font-extrabold uppercase text-accent">Descanso en curso</span>
          </div>
          <p id="rest-widget-exercise" class="text-xs text-soft truncate font-semibold mt-0.5">Ejercicio</p>
        </div>
        <div id="rest-widget-countdown" class="rest-countdown text-strong tabular-nums">01:30</div>
      </div>

      <div class="progress-track mb-3">
        <div id="rest-widget-bar" class="progress-fill" style="width:100%"></div>
      </div>

      <div class="grid-4 gap-2">
        <button type="button" class="btn btn--surface btn--xs" data-action="adjust-rest" data-delta="-15">-15s</button>
        <button type="button" class="btn btn--surface btn--xs" data-action="adjust-rest" data-delta="15">+15s</button>
        <button type="button" class="btn btn--surface btn--xs" data-action="adjust-rest" data-delta="30">+30s</button>
        <button type="button" class="btn btn--primary btn--xs" data-action="skip-rest">Saltar</button>
      </div>
    </div>
  </div>

  <!-- Navegación Inferior Fija -->
  <nav class="bottom-nav" aria-label="Navegación principal">
    <div class="bottom-nav__inner">
      <button type="button" id="nav-train" class="nav-btn is-active" data-action="switch-tab" data-tab="train">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/>
        </svg>
        <span>Entrenar</span>
      </button>

      <button type="button" id="nav-progress" class="nav-btn" data-action="switch-tab" data-tab="progress">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
        </svg>
        <span>Progreso</span>
      </button>

      <button type="button" id="nav-weight" class="nav-btn" data-action="switch-tab" data-tab="weight">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"/>
        </svg>
        <span>Peso</span>
      </button>

      <button type="button" id="nav-settings" class="nav-btn" data-action="switch-tab" data-tab="settings">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        <span>Ajustes</span>
      </button>
    </div>
  </nav>

  <!-- Modal Reutilizable Accesible -->
  <div id="modal-backdrop" class="modal-backdrop hidden" role="dialog" aria-modal="true">
    <div id="modal-content" class="modal-panel"></div>
  </div>

  <script type="module" src="./js/app.js"></script>
</body>
</html>
