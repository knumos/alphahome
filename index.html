        }

    // Estado global en memoria
    let state = loadState();

    // Estado volátil de temporizadores (no necesita guardarse cada segundo, excepto endTime)

      active: false,
      endTime: 0,
      totalSec: 0,
      remainingSec: 0,

    // -------------------------------------------------------------------------
    // 2. PERSISTENCIA EN LOCALSTORAGE
    // -------------------------------------------------------------------------
    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return getDefaultState();
        const parsed = JSON.parse(raw);
        const def = getDefaultState();
        const validTabs = ['train', 'progress', 'weight', 'settings'];
        const loadedTab = parsed.ui && validTabs.includes(parsed.ui.activeTab) ? parsed.ui.activeTab : 'train';

        const loadedBodyMetrics = parsed.bodyMetrics && Array.isArray(parsed.bodyMetrics.logs)
          ? {
              heightMeters: Number(parsed.bodyMetrics.heightMeters) || 1.80,
              logs: parsed.bodyMetrics.logs
            }
          : def.bodyMetrics;

        const mergedRoutines = (Array.isArray(parsed.routines) && parsed.routines.length ? parsed.routines : def.routines).map(r => {
          const defMatch = def.routines.find(d => d.id === r.id);
          return {
            ...r,
            warmup: Array.isArray(r.warmup) && r.warmup.length ? r.warmup : (defMatch ? defMatch.warmup : [])
          };
        });

        return {
          routines: mergedRoutines,
          activeWorkout: parsed.activeWorkout || null,
          history: Array.isArray(parsed.history) ? parsed.history : [],
          bodyMetrics: loadedBodyMetrics,
          settings: { ...def.settings, ...(parsed.settings || {}) },
          ui: { ...def.ui, ...(parsed.ui || {}), activeTab: loadedTab }
        };
      } catch (err) {
        console.error('Error cargando estado:', err);
        return getDefaultState();
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (err) {
        console.error('Error guardando estado:', err);
        showToast('No se pudo guardar en memoria local.', 'error');
      }
    }

    // -------------------------------------------------------------------------
    // 3. AUDIO (WEB AUDIO API), VIBRACIÓN Y NOTIFICACIONES
    // -------------------------------------------------------------------------
    function ensureAudioContext() {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {
        console.warn('AudioContext no disponible:', e);
      }
    }

    function playRestBeep() {
      if (!state.settings.soundEnabled) return;
      try {
        ensureAudioContext();
        if (!audioCtx) return;

        const now = audioCtx.currentTime;
        // Beep doble claro y agradable
        [0, 0.22].forEach((offset, idx) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(idx === 0 ? 784 : 1046.5, now + offset);
          gain.gain.setValueAtTime(0.001, now + offset);
          gain.gain.exponentialRampToValueAtTime(0.22, now + offset + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.18);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + offset);
          osc.stop(now + offset + 0.2);
        });
      } catch (e) {
        console.warn('No se pudo reproducir el sonido:', e);
      }
    }

    function triggerVibration() {
      if (!state.settings.vibrationEnabled) return;
      try {

    function requestNotificationPermission() {
      if (!('Notification' in window)) {
        showToast('Tu navegador no soporta notificaciones del sistema.', 'warning');
        return;
      }
      if (Notification.permission === 'granted') {
        state.settings.notificationsEnabled = true;
        saveState();
        sendSystemNotification('AlphaHome', 'Las notificaciones de descanso están activas.');
        showToast('Notificación de prueba enviada.', 'success');
        render();
        return;
      }
      Notification.requestPermission().then(perm => {
        if (perm === 'granted') {
          state.settings.notificationsEnabled = true;
          saveState();
          sendSystemNotification('AlphaHome', 'Notificaciones activadas correctamente.');
          showToast('Notificaciones activadas.', 'success');
        } else {
          state.settings.notificationsEnabled = false;
          saveState();
          showToast('Permiso de notificaciones denegado.', 'warning');
        }
        render();
      }).catch(() => {
        showToast('No se pudo solicitar el permiso de notificaciones.', 'error');
      });
    }

    function sendSystemNotification(title, body) {
      if (!('Notification' in window) || Notification.permission !== 'granted') return;
      try {
        new Notification(title, { body, silent: false });
      } catch (e) {
        console.warn('Error enviando notificación:', e);
      }
    }

    // 3B. LÓGICA DE PESO CORPORAL, IMC Y PROMEDIO MÓVIL DE 7 DÍAS

    function getSortedWeightLogsDesc() {
      const logs = (state.bodyMetrics && Array.isArray(state.bodyMetrics.logs)) ? [...state.bodyMetrics.logs] : [];
      return logs.sort((a, b) => {
        if (a.date !== b.date) return b.date.localeCompare(a.date);
        return String(b.id).localeCompare(String(a.id));
      });
    }

    function getCurrentBodyWeight() {
      const sorted = getSortedWeightLogsDesc();
      return sorted.length ? Number(sorted[0].weight) : 88.0;
    }

    function getInitialBodyWeight() {
      const sorted = getSortedWeightLogsDesc();
      return sorted.length ? Number(sorted[sorted.length - 1].weight) : 88.0;
    }

    function get7DayMovingAverageWeight() {
      const sorted = getSortedWeightLogsDesc();
      if (!sorted.length) return 88.0;
      const latestDateMs = new Date(sorted[0].date + 'T12:00:00').getTime();
      const sevenDaysMs = 7 * 24 * 60 * 60 * 1000;
      const recent = sorted.filter(item => {
        const ms = new Date(item.date + 'T12:00:00').getTime();
        return (latestDateMs - ms) <= sevenDaysMs;
      });
      const pool = recent.length ? recent : sorted.slice(0, 7);
      const avg = pool.reduce((sum, item) => sum + Number(item.weight), 0) / pool.length;
      return avg;
    }

    function calculateBMI(weightKg, heightMeters) {
      const h = Number(heightMeters) || 1.80;
      const bmi = weightKg / (h * h);
      let category = 'Normal';
      let colorClass = 'text-emerald-400';
      if (bmi < 18.5) { category = 'Bajo peso'; colorClass = 'text-cyan-300'; }
      else if (bmi < 25) { category = 'Normal'; colorClass = 'text-emerald-400'; }
      else if (bmi < 30) { category = 'Sobrepeso'; colorClass = 'text-amber-300'; }
      else { category = 'Obesidad'; colorClass = 'text-rose-400'; }
      return { value: bmi, category, colorClass };
    }

    // -------------------------------------------------------------------------
    // 4. ALGORITMO DE PROGRESIÓN ESTILO ALPHA PROGRESSION
    // -------------------------------------------------------------------------

    /**
     * Busca el último registro histórico de un ejercicio por su nombre exacto.
     */
    function getLastExerciseLog(exerciseName) {
      for (let i = 0; i < state.history.length; i++) {
        const session = state.history[i];
        const found = (session.exercises || []).find(e => e.name === exerciseName && e.sets.some(s => s.done));
        if (found) {
          const completedSets = found.sets.filter(s => s.done);
          return {
            date: session.date,
            sets: completedSets
          };
        }
      }
      return null;
    }

    /**
     * Calcula la meta recomendada para hoy basada en el historial del ejercicio,
     * el equipo (tope 24 kg por mancuerna) y el Modo Readaptación vs Progresión.
     */
    function calculateRecommendation(exercise) {
      const last = getLastExerciseLog(exercise.name);
      const isReadapt = state.settings.readaptationMode;
      const targetRir = isReadapt ? '2-3' : '1-2';

      if (!last || last.sets.length === 0) {
        if (isReadapt) {
          return {
            summary: `Carga moderada (70-75%) × ${exercise.minReps}-${exercise.maxReps} reps @ RIR 2-3`,
            detail: 'Fase de readaptación: prioriza técnica limpia sin llegar al fallo.',
            suggestedWeight: exercise.equipment === 'dumbbell' ? 10 : 0,
            suggestedReps: exercise.minReps,
            suggestedRir: 3,
            badge: 'Readaptación',
            badgeColor: 'amber'
          };
        }
        return {
          summary: `${exercise.minReps}-${exercise.maxReps} reps @ RIR 1-2`,
          detail: 'Primera sesión registrada. Establece tu peso base con técnica sólida.',
          suggestedWeight: exercise.equipment === 'dumbbell' ? 12 : 0,
          suggestedReps: exercise.minReps,
          suggestedRir: 2,
          badge: 'Base Inicial',
          badgeColor: 'indigo'
        };
      }

      // Analizar las series completadas de la última sesión
      const sets = last.sets;
      const maxWeight = Math.max(...sets.map(s => Number(s.weight) || 0));
      const avgReps = Math.round(sets.reduce((acc, s) => acc + (Number(s.reps) || 0), 0) / sets.length);
      const minAchievedReps = Math.min(...sets.map(s => Number(s.reps) || 0));
      const avgRir = sets.reduce((acc, s) => acc + (s.rir !== '' && s.rir !== null ? Number(s.rir) : 2), 0) / sets.length;
      const hadFailure = sets.some(s => Number(s.rir) === 0);
      const allReachedTop = sets.every(s => (Number(s.reps) || 0) >= exercise.maxReps);
      const lastMods = sets[0].mods || {};

      // MODO READAPTACIÓN (Semanas 1-2)
      if (isReadapt) {
        const conservativeWeight = maxWeight > 0 ? Math.max(2, Math.round((maxWeight * 0.9) / 2) * 2) : 0;
        if (hadFailure) {
          return {
            summary: `${conservativeWeight > 0 ? conservativeWeight + ' kg × ' : ''}${exercise.minReps}-${exercise.maxReps} reps @ RIR 2-3`,
            detail: 'Llegaste al fallo la última vez. Baja un poco la carga en readaptación para evitar agujetas excesivas.',
            suggestedWeight: conservativeWeight,
            suggestedReps: exercise.minReps,
            suggestedRir: 3,
            badge: 'Readaptación',
            badgeColor: 'amber'
          };
        }
        return {
          summary: `${maxWeight > 0 ? maxWeight + ' kg × ' : ''}${Math.min(exercise.maxReps, avgReps + 1)} reps @ RIR 2-3`,
          detail: 'Mantén carga controlada y suma 1 rep limpia dejando 2-3 en recámara.',
          suggestedWeight: maxWeight,
          suggestedReps: Math.min(exercise.maxReps, avgReps + 1),
          suggestedRir: 2,
          badge: 'Readaptación',
          badgeColor: 'amber'
        };
      }

      // MODO PROGRESIÓN (Doble progresión automática)
      // Caso 1: Fallo por debajo del rango mínimo -> consolidar o reducir ligeramente
      if (hadFailure && minAchievedReps < exercise.minReps) {
        const reduced = maxWeight >= 4 ? maxWeight - (exercise.stepKg || 2) : maxWeight;
        return {
          summary: `${reduced > 0 ? reduced + ' kg × ' : ''}${exercise.minReps} reps @ RIR 1-2`,
          detail: 'RIR 0 por debajo del rango mínimo. Reduce ligeramente el peso para consolidar técnica.',
          suggestedWeight: reduced,
          suggestedReps: exercise.minReps,
          suggestedRir: 2,
          badge: 'Consolidar',
          badgeColor: 'rose'
        };
      }

      // Caso 2: Alcanzó el tope del rango con RIR >= 1
      if (allReachedTop && avgRir >= 1) {
        // Regla especial: mancuernas al tope de 24 kg c/u
        if (exercise.equipment === 'dumbbell' && maxWeight >= 24) {
          let overloadTip = 'Activa Chaleco +10kg o Pausa 2s abajo';
          if (lastMods.vest && !lastMods.pause) overloadTip = 'Mantén Chaleco +10kg y agrega Pausa 2s';
          else if (lastMods.pause && !lastMods.band) overloadTip = 'Agrega Banda de resistencia o pasa a variante unilateral';

          return {
            summary: `24 kg × ${exercise.minReps}-${exercise.maxReps} reps + Sobrecarga`,
            detail: `¡Tope de 24 kg alcanzado! ${overloadTip} para seguir progresando en casa.`,
            suggestedWeight: 24,
            suggestedReps: exercise.minReps,
            suggestedRir: 1,
            badge: 'Tope 24kg ⚡',
            badgeColor: 'emerald'
          };
        }

        // Regla especial: peso corporal (dominadas)
        if (exercise.equipment === 'bodyweight') {
          const nextWeight = maxWeight + (exercise.stepKg || 2);
          const extraNote = maxWeight === 0
            ? 'Añade el Chaleco +10kg o lastre con cadena.'
            : `Sube a +${nextWeight} kg de lastre (chaleco/cadena).`;
          return {
            summary: `+${nextWeight} kg × ${exercise.minReps} reps @ RIR 1-2`,
            detail: `Dominaste ${exercise.maxReps} reps. ${extraNote}`,
            suggestedWeight: nextWeight,
            suggestedReps: exercise.minReps,
            suggestedRir: 2,
            badge: 'Subir Lastre ↑',
            badgeColor: 'emerald'
          };
        }

        // Subida estándar de peso
        const step = exercise.stepKg || 2;
        const nextWeight = exercise.equipment === 'dumbbell'
          ? Math.min(24, maxWeight + step)
          : maxWeight + step;

        return {
          summary: `${nextWeight > 0 ? nextWeight + ' kg × ' : ''}${exercise.minReps} reps @ RIR 1-2`,
          detail: `¡Superaste el tope de ${exercise.maxReps} reps con buen RIR! Sube +${step} kg y reinicia en ${exercise.minReps} reps.`,
          suggestedWeight: nextWeight,
          suggestedReps: exercise.minReps,
          suggestedRir: 2,
          badge: `Subir +${step}kg ↑`,
          badgeColor: 'emerald'
        };
      }

      // Caso 3: Dentro del rango con buen RIR -> buscar +1 o +2 reps
      const repIncrement = avgRir >= 2.5 ? 2 : 1;
      const targetReps = Math.min(exercise.maxReps, avgReps + repIncrement);
      return {
        summary: `${maxWeight > 0 ? maxWeight + ' kg × ' : ''}${targetReps} reps @ RIR ${targetRir}`,
        detail: `Mantén la carga y busca +${repIncrement} rep${repIncrement > 1 ? 's' : ''} respecto a tu sesión anterior.`,
        suggestedWeight: maxWeight,
        suggestedReps: targetReps,
        suggestedRir: 1,
        badge: `+${repIncrement} Rep${repIncrement > 1 ? 's' : ''} →`,
        badgeColor: 'indigo'
      };
    }

    // -------------------------------------------------------------------------
    // 5. GESTIÓN DE ENTRENAMIENTO ACTIVO Y CRONÓMETROS
    // -------------------------------------------------------------------------
    function startWorkout(dayId) {
      ensureAudioContext();
      const routine = state.routines.find(r => r.id === dayId);
      if (!routine) return;

      const exercises = routine.exercises.map(ex => {
        const rec = calculateRecommendation(ex);
        const last = getLastExerciseLog(ex.name);
        const setsArr = [];
        for (let i = 0; i < ex.sets; i++) {
          const prevSet = last && last.sets[i] ? last.sets[i] : null;
          setsArr.push({
            weight: rec.suggestedWeight || (prevSet ? prevSet.weight : ''),
            reps: rec.suggestedReps || ex.minReps,
            rir: rec.suggestedRir,
            done: false,
            mods: prevSet && prevSet.mods ? { ...prevSet.mods } : { vest: false, band: false, pause: false, chain: false }
          });
        }
        return {
          ...JSON.parse(JSON.stringify(ex)),
          sets: setsArr,
          tutSeconds: 0
        };
      });

      const warmupItems = (routine.warmup || []).map(w => ({ ...w, done: false }));

      state.activeWorkout = {
        dayId: routine.id,
        dayName: routine.name,
        focus: routine.focus,
        startedAt: Date.now(),
        accumulatedSec: 0,
        lastResumeAt: Date.now(),
        paused: false,
        warmupCollapsed: false,
        warmup: warmupItems,
        exercises
      };

      state.ui.activeTab = 'train';
      saveState();
      startSessionTicker();
      showToast(`Sesión iniciada: ${routine.name}`, 'success');
      render();
      syncWakeLock();
    }

    function getSessionElapsedSeconds() {
      const aw = state.activeWorkout;
      if (!aw) return 0;
      if (aw.paused) return aw.accumulatedSec;
      return aw.accumulatedSec + Math.floor((Date.now() - aw.lastResumeAt) / 1000);
    }

    function toggleSessionPause() {
      const aw = state.activeWorkout;
      if (!aw) return;
      if (aw.paused) {
        aw.paused = false;
        aw.lastResumeAt = Date.now();
        showToast('Entrenamiento reanudado', 'info');
      } else {
        aw.accumulatedSec = getSessionElapsedSeconds();
        aw.paused = true;
        showToast('Entrenamiento en pausa', 'warning');
      }
      saveState();
      renderHeader();
      syncWakeLock();
    }

    // -------------------------------------------------------------------------
    // 5B. WAKE LOCK — pantalla encendida solo durante la sesión activa
    // La preferencia vive en su propia clave para no modificar alphahome_state_v1.
    // -------------------------------------------------------------------------
    const WAKE_LOCK_PREF_KEY = 'alphahome_screen_wake_lock';
    let wakeLockSentinel = null;
    let wakeLockRequest = null;
    let wakeLockActive = false;

    function wakeLockSupported() {
      try {
        return !!(navigator.wakeLock && typeof navigator.wakeLock.request === 'function');
      } catch (e) {
        return false;
      }
    }

    function isWakeLockPreferred() {
      try {
        const value = localStorage.getItem(WAKE_LOCK_PREF_KEY);
        if (value === null) return true;
        return value === '1';
      } catch (e) {
        return true;
      }
    }

    function workoutWantsWakeLock() {
      const aw = state.activeWorkout;
      return !!(aw && !aw.paused && isWakeLockPreferred());
    }

    function updateWakeLockIndicator() {
      const el = document.getElementById('wake-lock-indicator');
      if (!el) return;
      const show = wakeLockActive && workoutWantsWakeLock();
      el.classList.toggle('hidden', !show);
    }

    async function acquireWakeLock() {
      if (!wakeLockSupported() || !workoutWantsWakeLock()) return;
      if (document.visibilityState !== 'visible') return;
      if (wakeLockSentinel) return;
      if (wakeLockRequest) return wakeLockRequest;

      wakeLockRequest = (async () => {
        try {
          const sentinel = await navigator.wakeLock.request('screen');
          if (!workoutWantsWakeLock() || document.visibilityState !== 'visible') {
            try { await sentinel.release(); } catch (e) {}
            wakeLockActive = false;
            return;
          }
          wakeLockSentinel = sentinel;
          wakeLockActive = true;
          const onRelease = () => {
            if (wakeLockSentinel === sentinel) {
              wakeLockSentinel = null;
              wakeLockActive = false;
              updateWakeLockIndicator();
            }
          };
          try { sentinel.addEventListener('release', onRelease); } catch (e) {}
        } catch (e) {
          wakeLockSentinel = null;
          wakeLockActive = false;
        } finally {
          wakeLockRequest = null;
          updateWakeLockIndicator();
        }
      })();

      return wakeLockRequest;
    }

    async function releaseWakeLock() {
      const sentinel = wakeLockSentinel;
      wakeLockSentinel = null;
      wakeLockActive = false;
      updateWakeLockIndicator();
      if (!sentinel) return;
      try { await sentinel.release(); } catch (e) {}
    }

    function syncWakeLock() {
      if (workoutWantsWakeLock() && document.visibilityState === 'visible') {
        acquireWakeLock().catch(() => {});
      } else {
        releaseWakeLock().catch(() => {});
      }
    }

    function toggleWakeLockPref() {
      try {
        localStorage.setItem(WAKE_LOCK_PREF_KEY, isWakeLockPreferred() ? '0' : '1');
      } catch (e) {}
      syncWakeLock();
      render();
    }

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') syncWakeLock();
    });

    function startSessionTicker() {
      if (sessionTickerId) clearInterval(sessionTickerId);
      sessionTickerId = setInterval(() => {
        if (state.activeWorkout) {
          updateSessionTimerUI();
        }
      }, 1000);
    }

    function updateSessionTimerUI() {
      const aw = state.activeWorkout;
      if (!aw) return;
      const elapsed = getSessionElapsedSeconds();
      const goalSec = (state.settings.sessionGoalMin || 60) * 60;
      const pct = Math.min(100, (elapsed / goalSec) * 100);

      const labelEl = document.getElementById('session-timer-label');
      const fillEl = document.getElementById('session-progress-fill');
      const setsEl = document.getElementById('session-sets-progress');

      if (labelEl) {
        labelEl.textContent = `${formatTime(elapsed)} / ${state.settings.sessionGoalMin}:00${aw.paused ? ' (Pausa)' : ''}`;
      }
      if (fillEl) {
        fillEl.style.width = `${pct}%`;
        if (elapsed > goalSec) {
          fillEl.classList.remove('from-indigo-500', 'to-emerald-400');
          fillEl.classList.add('from-amber-500', 'to-rose-500');
        }
      }
      if (setsEl) {
        const totalSets = aw.exercises.reduce((sum, ex) => sum + ex.sets.length, 0);
        const doneSets = aw.exercises.reduce((sum, ex) => sum + ex.sets.filter(s => s.done).length, 0);
        setsEl.textContent = `${doneSets} / ${totalSets} series`;
      }
      updateWakeLockIndicator();
    }

    // -------------------------------------------------------------------------
    // 6. TEMPORIZADOR DE DESCANSO INTELIGENTE
    // -------------------------------------------------------------------------
    function startRestTimer(seconds, exerciseName) {
      ensureAudioContext();
      dismissRestAlert();
      const sec = Math.max(5, Number(seconds) || 60);
      restTimer.active = true;
      restTimer.totalSec = sec;
      restTimer.remainingSec = sec;
      restTimer.endTime = Date.now() + sec * 1000;
      restTimer.exerciseName = exerciseName || 'Descanso';

      if (restTimer.intervalId) clearInterval(restTimer.intervalId);
      updateRestWidgetUI();

      restTimer.intervalId = setInterval(() => {
        const rem = Math.max(0, Math.ceil((restTimer.endTime - Date.now()) / 1000));
        restTimer.remainingSec = rem;
        updateRestWidgetUI();

        if (rem <= 0) {
          completeRestTimer();
        }
      }, 250);
    }

    function adjustRestTimer(deltaSec) {
      if (!restTimer.active) return;
      const newEnd = restTimer.endTime + deltaSec * 1000;
      const newRem = Math.max(1, Math.ceil((newEnd - Date.now()) / 1000));
      restTimer.endTime = Date.now() + newRem * 1000;
      restTimer.remainingSec = newRem;
      if (newRem > restTimer.totalSec) restTimer.totalSec = newRem;
      updateRestWidgetUI();
    }

    function skipRestTimer() {
      if (restTimer.intervalId) clearInterval(restTimer.intervalId);
      restTimer.active = false;
      restTimer.intervalId = null;
      document.getElementById('rest-timer-widget').classList.add('hidden');
    }

    function completeRestTimer() {
      if (restTimer.intervalId) clearInterval(restTimer.intervalId);
      restTimer.active = false;
      restTimer.intervalId = null;
      document.getElementById('rest-timer-widget').classList.add('hidden');

      // 1. Sonido Web Audio API
      playRestBeep();
      // 2. Vibración
      triggerVibration();
      // 3. Notificación del navegador
      sendSystemNotification('¡Descanso terminado!', `Siguiente serie: ${restTimer.exerciseName}`);
      // 4. Alerta visual en pantalla
      const banner = document.getElementById('rest-alert-banner');
      const sub = document.getElementById('rest-alert-subtitle');
      sub.textContent = `Siguiente serie: ${restTimer.exerciseName}`;
      banner.classList.remove('hidden');
      banner.firstElementChild.classList.add('rest-complete-flash');
    }

    function dismissRestAlert() {
      const banner = document.getElementById('rest-alert-banner');
      banner.classList.add('hidden');
      banner.firstElementChild.classList.remove('rest-complete-flash');
    }

    function updateRestWidgetUI() {
      const widget = document.getElementById('rest-timer-widget');
      if (!restTimer.active) {
        widget.classList.add('hidden');
        return;
      }
      widget.classList.remove('hidden');
      document.getElementById('rest-widget-exercise').textContent = restTimer.exerciseName;
      document.getElementById('rest-widget-countdown').textContent = formatTime(restTimer.remainingSec);
      const pct = restTimer.totalSec > 0 ? Math.max(0, (restTimer.remainingSec / restTimer.totalSec) * 100) : 0;
      document.getElementById('rest-widget-bar').style.width = `${pct}%`;
    }

    // -------------------------------------------------------------------------
    // 7. CRONÓMETRO DE SERIE / TIEMPO BAJO TENSIÓN (TUT)
    // -------------------------------------------------------------------------
    function toggleTutTimer(exIdx) {
      ensureAudioContext();
      if (tutTimer.active && tutTimer.exerciseIdx === exIdx) {
        // Detener y guardar tiempo en el ejercicio
        clearInterval(tutTimer.intervalId);
        const elapsed = Math.floor((Date.now() - tutTimer.startTime) / 1000);
        if (state.activeWorkout && state.activeWorkout.exercises[exIdx]) {
          state.activeWorkout.exercises[exIdx].tutSeconds = elapsed;
          saveState();
        }
        tutTimer.active = false;
        tutTimer.exerciseIdx = null;
        showToast(`Serie cronometrada: ${elapsed}s bajo tensión`, 'info');
        render();
        return;
      }

      if (tutTimer.active) {
        clearInterval(tutTimer.intervalId);
      }

      tutTimer.active = true;
      tutTimer.exerciseIdx = exIdx;
      tutTimer.startTime = Date.now();
      tutTimer.elapsedSec = 0;

      tutTimer.intervalId = setInterval(() => {
        tutTimer.elapsedSec = Math.floor((Date.now() - tutTimer.startTime) / 1000);
        const el = document.getElementById(`tut-display-${exIdx}`);
        if (el) el.textContent = `${tutTimer.elapsedSec}s`;
      }, 250);

      render();
    }

    // -------------------------------------------------------------------------
    // 8. ACCIONES SOBRE SERIES Y EJERCICIOS EN VIVO
    // -------------------------------------------------------------------------
    function toggleWarmupItem(wIdx) {
      if (!state.activeWorkout || !Array.isArray(state.activeWorkout.warmup)) return;
      const item = state.activeWorkout.warmup[wIdx];
      if (!item) return;
      item.done = !item.done;
      const allDone = state.activeWorkout.warmup.every(w => w.done);
      if (allDone) {
        showToast('¡Calentamiento completado! Listo para las series efectivas.', 'success');
      }
      saveState();
      render();
    }

    function completeAllWarmup() {
      if (!state.activeWorkout || !Array.isArray(state.activeWorkout.warmup)) return;
      state.activeWorkout.warmup.forEach(w => { w.done = true; });
      state.activeWorkout.warmupCollapsed = true;
      saveState();
      showToast('Calentamiento marcado como listo.', 'success');
      render();
    }

    function toggleWarmupCollapse() {
      if (!state.activeWorkout) return;
      state.activeWorkout.warmupCollapsed = !state.activeWorkout.warmupCollapsed;
      saveState();
      render();
    }

    function updateSetField(exIdx, setIdx, field, value) {
      if (!state.activeWorkout) return;
      const ex = state.activeWorkout.exercises[exIdx];
      const setObj = ex.sets[setIdx];
      setObj[field] = value === '' ? '' : Number(value);
      saveState();
      if (ex.equipment === 'bodyweight' && field === 'weight') {
        render();
      }
    }

    function toggleSetMod(exIdx, setIdx, modKey) {
      if (!state.activeWorkout) return;
      const setObj = state.activeWorkout.exercises[exIdx].sets[setIdx];
      if (!setObj.mods) setObj.mods = { vest: false, band: false, pause: false, chain: false };
      setObj.mods[modKey] = !setObj.mods[modKey];
      saveState();
      render();
    }

    function toggleSetDone(exIdx, setIdx) {
      if (!state.activeWorkout) return;
      const ex = state.activeWorkout.exercises[exIdx];
      const setObj = ex.sets[setIdx];
      setObj.done = !setObj.done;

      // Si se acaba de completar la serie, lanzar descanso automático si está activado
      if (setObj.done && state.settings.autoRest) {
        startRestTimer(ex.restSec, ex.name);
      }
      saveState();
      render();
    }

    function addSetToExercise(exIdx) {
      if (!state.activeWorkout) return;
      const ex = state.activeWorkout.exercises[exIdx];
      const lastSet = ex.sets[ex.sets.length - 1] || { weight: 10, reps: ex.minReps, rir: 2, mods: {} };
      ex.sets.push({
        weight: lastSet.weight,
        reps: lastSet.reps,
        rir: lastSet.rir,
        done: false,
        mods: { ...(lastSet.mods || { vest: false, band: false, pause: false, chain: false }) }
      });
      saveState();
      render();
    }

    function removeSetFromExercise(exIdx) {
      if (!state.activeWorkout) return;
      const ex = state.activeWorkout.exercises[exIdx];
      if (ex.sets.length <= 1) {
        showToast('Debe quedar al menos 1 serie en el ejercicio.', 'warning');
        return;
      }
      ex.sets.pop();
      saveState();
      render();
    }

    function openEditRestModal(exIdx) {
      const ex = state.activeWorkout.exercises[exIdx];
      openModal(`
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-bold text-white">Tiempo de Descanso</h3>
          <button onclick="closeModal()" class="p-2 rounded-xl bg-surface-800 text-slate-400">✕</button>
        </div>
        <p class="text-xs text-slate-400 mb-4">${escapeHtml(ex.name)}</p>
        <div class="grid grid-cols-4 gap-2 mb-4">
          ${[15, 45, 60, 75, 90, 120, 150, 180].map(sec => `
            <button onclick="setExerciseRest(${exIdx}, ${sec})" class="py-2.5 rounded-xl text-xs font-bold ${ex.restSec === sec ? 'bg-indigo-600 text-white' : 'bg-surface-800 text-slate-200 hover:bg-surface-700'}">
              ${formatTime(sec)}
            </button>
          `).join('')}
        </div>
        <div class="flex gap-2">
          <input id="custom-rest-input" type="number" min="5" max="600" value="${ex.restSec}" class="flex-1 bg-surface-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white" placeholder="Segundos" />
          <button onclick="setExerciseRest(${exIdx}, document.getElementById('custom-rest-input').value)" class="px-4 py-2.5 rounded-xl bg-emerald-500 text-slate-950 font-bold text-sm">
            Aplicar
          </button>
        </div>
      `);
    }

    function setExerciseRest(exIdx, sec) {
      const val = Math.max(5, Math.min(600, Number(sec) || 60));
      if (state.activeWorkout && state.activeWorkout.exercises[exIdx]) {
        state.activeWorkout.exercises[exIdx].restSec = val;
        // También actualizar en la plantilla de rutina para futuras sesiones
        const r = state.routines.find(d => d.id === state.activeWorkout.dayId);
        if (r && r.exercises[exIdx]) r.exercises[exIdx].restSec = val;
        saveState();
      }
      closeModal();
      showToast(`Descanso actualizado a ${formatTime(val)}`, 'info');
      render();
    }

    // -------------------------------------------------------------------------
    // 9. ROTACIÓN / CAMBIO DE EJERCICIOS
    // -------------------------------------------------------------------------
    function openSwapExerciseModal(exIdx, context = 'active', dayId = null) {
      let ex;
      if (context === 'active') {
        ex = state.activeWorkout.exercises[exIdx];
      } else {
        const r = state.routines.find(d => d.id === dayId);
        ex = r.exercises[exIdx];
      }

      const alts = ex.alternatives || [];

      openModal(`
        <div class="flex items-center justify-between mb-3">
          <h3 class="text-lg font-bold text-white">Cambiar Ejercicio</h3>
          <button onclick="closeModal()" class="p-2 rounded-xl bg-surface-800 text-slate-400">✕</button>
        </div>
        <p class="text-xs text-slate-400 mb-4">Actual: <span class="text-indigo-300 font-semibold">${escapeHtml(ex.name)}</span>. El historial se conserva de forma independiente por nombre de ejercicio.</p>

        <div class="space-y-2 mb-5">
          <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400">Alternativas recomendadas</p>
          ${alts.length ? alts.map((altName) => `
            <button onclick="applyExerciseSwap(${exIdx}, '${escapeJs(altName)}', '${context}', '${dayId || ''}')" class="w-full text-left p-3.5 rounded-2xl bg-surface-800 hover:bg-surface-700 border border-slate-700/70 flex items-center justify-between gap-2 transition">
              <span class="text-sm font-semibold text-white">${escapeHtml(altName)}</span>
              <span class="text-xs font-bold text-indigo-400">Elegir →</span>
            </button>
          `).join('') : '<p class="text-xs text-slate-500">No hay alternativas predefinidas.</p>'}
        </div>

        <div class="border-t border-slate-800 pt-4">
          <p class="text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-2">O escribe un ejercicio personalizado</p>
          <div class="flex gap-2">
            <input id="custom-swap-name" type="text" placeholder="Ej. Press Arnold con mancuernas" class="flex-1 bg-surface-800 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none focus:border-indigo-500" />
            <button onclick="applyExerciseSwap(${exIdx}, document.getElementById('custom-swap-name').value.trim(), '${context}', '${dayId || ''}')" class="px-4 py-2.5 rounded-xl bg-indigo-600 text-white font-bold text-sm">
              Usar
            </button>
          </div>
          ${context === 'active' ? `
            <label class="flex items-center gap-2 mt-3 text-xs text-slate-300 cursor-pointer">
              <input id="swap-save-template" type="checkbox" class="rounded bg-surface-800 border-slate-600 text-indigo-500" />
              Guardar también este cambio en mi plantilla de rutina
            </label>
          ` : ''}
        </div>
      `);
    }

    function applyExerciseSwap(exIdx, newName, context, dayId) {
      if (!newName) {
        showToast('Escribe el nombre del ejercicio.', 'warning');
        return;
      }

      if (context === 'active' && state.activeWorkout) {
        const ex = state.activeWorkout.exercises[exIdx];
        const oldName = ex.name;
        if (oldName !== newName) {
          // Mover el anterior a alternativas para poder volver luego
          const newAlts = new Set([...(ex.alternatives || []), oldName]);
          newAlts.delete(newName);
          ex.alternatives = Array.from(newAlts);
          ex.name = newName;

          // Recalcular valores sugeridos en series no completadas
          const rec = calculateRecommendation(ex);
          ex.sets.forEach(s => {
            if (!s.done) {
              s.weight = rec.suggestedWeight || s.weight;
              s.reps = rec.suggestedReps || ex.minReps;
              s.rir = rec.suggestedRir;
            }
          });

          const saveTpl = document.getElementById('swap-save-template')?.checked;
          if (saveTpl) {
            const r = state.routines.find(d => d.id === state.activeWorkout.dayId);
            if (r && r.exercises[exIdx]) {
              r.exercises[exIdx].name = newName;
              r.exercises[exIdx].alternatives = ex.alternatives;
            }
          }
        }
      } else if (context === 'routine') {
        const r = state.routines.find(d => d.id === dayId);
        if (r && r.exercises[exIdx]) {
          const ex = r.exercises[exIdx];
          const oldName = ex.name;
          if (oldName !== newName) {
            const newAlts = new Set([...(ex.alternatives || []), oldName]);
            newAlts.delete(newName);
            ex.alternatives = Array.from(newAlts);
            ex.name = newName;
          }
        }
      }

      saveState();
      closeModal();
      showToast(`Ejercicio cambiado a: ${newName}`, 'success');
      render();
    }

    // -------------------------------------------------------------------------
    // 10. FINALIZAR O CANCELAR ENTRENAMIENTO
    // -------------------------------------------------------------------------
    function openFinishWorkoutModal() {
      const aw = state.activeWorkout;
      if (!aw) return;
      const elapsed = getSessionElapsedSeconds();
      const doneSets = aw.exercises.reduce((sum, ex) => sum + ex.sets.filter(s => s.done).length, 0);
      const totalSets = aw.exercises.reduce((sum, ex) => sum + ex.sets.length, 0);
      const volume = computeWorkoutVolume(aw.exercises);

      openModal(`
        <div class="text-center mb-4">
          <div class="w-14 h-14 mx-auto rounded-2xl bg-emerald-500/15 border border-emerald-500/30 flex items-center justify-center text-3xl mb-3">🏆</div>
          <h3 class="text-xl font-extrabold text-white">¿Finalizar Entrenamiento?</h3>
          <p class="text-xs text-slate-400 mt-1">${escapeHtml(aw.dayName)}</p>
        </div>

        <div class="grid grid-cols-3 gap-2 mb-5">
          <div class="p-3 rounded-2xl bg-surface-800 text-center">
            <p class="text-[10px] uppercase text-slate-400 font-bold">Duración</p>
            <p class="text-base font-extrabold text-white tabular-nums mt-0.5">${formatTime(elapsed)}</p>
          </div>
          <div class="p-3 rounded-2xl bg-surface-800 text-center">
            <p class="text-[10px] uppercase text-slate-400 font-bold">Series</p>
            <p class="text-base font-extrabold text-emerald-400 mt-0.5">${doneSets}/${totalSets}</p>
          </div>
          <div class="p-3 rounded-2xl bg-surface-800 text-center">
            <p class="text-[10px] uppercase text-slate-400 font-bold">Volumen</p>
            <p class="text-base font-extrabold text-indigo-400 mt-0.5">${volume.toLocaleString('es-MX')} kg</p>
          </div>
        </div>

        ${doneSets === 0 ? `
          <div class="p-3 rounded-xl bg-amber-500/10 border border-amber-500/30 text-amber-300 text-xs mb-4">
            Aún no has marcado ninguna serie como completada. Marca al menos una para guardar progreso.
          </div>
        ` : ''}

        <div class="flex flex-col gap-2">
          <button onclick="confirmFinishWorkout()" class="w-full py-3.5 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-sm active:scale-[0.99] transition">
            Guardar y Terminar Sesión
          </button>
          <button onclick="closeModal()" class="w-full py-3 rounded-2xl bg-surface-800 text-slate-300 font-bold text-sm">
            Seguir Entrenando
          </button>
          <button onclick="openDiscardWorkoutModal()" class="w-full py-2.5 rounded-2xl text-rose-400 hover:bg-rose-500/10 font-semibold text-xs mt-1">
            Descartar sesión sin guardar
          </button>

    function openDiscardWorkoutModal() {
      openModal(`
        <h3 class="text-lg font-bold text-white mb-2">¿Descartar entrenamiento?</h3>
        <p class="text-xs text-slate-400 mb-5">Se perderán las series registradas en esta sesión activa y no se guardará en el historial.</p>
        <div class="flex gap-2">
          <button onclick="closeModal()" class="flex-1 py-3 rounded-xl bg-surface-800 text-slate-200 font-bold text-sm">Cancelar</button>
          <button onclick="discardWorkout()" class="flex-1 py-3 rounded-xl bg-rose-600 text-white font-bold text-sm">Sí, descartar</button>
        </div>
      `);
    }

    function discardWorkout() {
      skipRestTimer();
      state.activeWorkout = null;
      syncWakeLock();
      saveState();
      closeModal();
      showToast('Sesión descartada.', 'info');
      render();
    }

    function confirmFinishWorkout() {
      const aw = state.activeWorkout;
      if (!aw) return;
      const elapsed = getSessionElapsedSeconds();
      const volume = computeWorkoutVolume(aw.exercises);

      const record = {
        id: 'w_' + Date.now(),
        date: new Date().toISOString(),
        dayId: aw.dayId,
        dayName: aw.dayName,
        durationSeconds: elapsed,
        totalVolume: volume,
        mode: state.settings.readaptationMode ? 'Readaptación' : 'Progresión',
        exercises: aw.exercises.map(ex => ({
          name: ex.name,
          equipment: ex.equipment,
          tutSeconds: ex.tutSeconds || 0,
          sets: ex.sets.filter(s => s.done)
        })).filter(ex => ex.sets.length > 0)
      };

      if (record.exercises.length > 0) {
        state.history.unshift(record);
      }

      skipRestTimer();
      state.activeWorkout = null;
      syncWakeLock();
      state.ui.activeTab = 'progress';
      saveState();
      closeModal();
      showToast('¡Entrenamiento guardado en tu historial!', 'success');
      render();
    }

    function computeWorkoutVolume(exercises) {
      let total = 0;
      exercises.forEach(ex => {
        ex.sets.forEach(s => {
          if (!s.done) return;
          const w = Number(s.weight) || 0;
          const r = Number(s.reps) || 0;
          const vestBonus = s.mods && s.mods.vest ? 10 : 0;
          // Para mancuernas bilaterales consideramos el peso por mancuerna + chaleco si aplica
          const effectiveWeight = w + vestBonus;
          total += effectiveWeight * r;
        });
      });
      return Math.round(total);
    }

    // -------------------------------------------------------------------------
    // 11. RENDERIZADO DE VISTAS (ENTRENAR, RUTINA, PROGRESO, AJUSTES)
    // -------------------------------------------------------------------------
    function switchTab(tab) {
      state.ui.activeTab = tab;
      saveState();
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function render() {
      renderHeader();
      renderNav();
      const main = document.getElementById('app-main');

      if (state.ui.activeTab === 'train') {
        main.innerHTML = state.activeWorkout ? renderActiveWorkoutView() : renderStartWorkoutView();
        if (state.activeWorkout) updateSessionTimerUI();
      } else if (state.ui.activeTab === 'progress') {
        main.innerHTML = renderProgressView();
      } else if (state.ui.activeTab === 'weight') {
        main.innerHTML = renderWeightView();
      } else if (state.ui.activeTab === 'settings') {
        main.innerHTML = renderSettingsView();
      }
    }

    function renderHeader() {
      const right = document.getElementById('header-right');
      const sub = document.getElementById('header-subtitle');
      const barWrap = document.getElementById('session-progress-bar-wrap');

      if (state.activeWorkout) {
        sub.textContent = state.activeWorkout.dayName;
        barWrap.classList.remove('hidden');
        right.innerHTML = `
          <button onclick="toggleSessionPause()" class="px-3 py-1.5 rounded-xl bg-surface-800 border border-slate-700 text-xs font-bold text-slate-200 active:scale-95">
            ${state.activeWorkout.paused ? '▶ Reanudar' : '⏸ Pausa'}
          </button>
          <button onclick="openFinishWorkoutModal()" class="px-3 py-1.5 rounded-xl bg-emerald-500 text-slate-950 text-xs font-extrabold active:scale-95">
            Finalizar
          </button>
        `;
        updateSessionTimerUI();
      } else {
        sub.textContent = state.settings.readaptationMode ? 'Modo Readaptación (Sem 1-2)' : 'Modo Doble Progresión';
        barWrap.classList.add('hidden');
        right.innerHTML = `
          <button onclick="toggleReadaptationMode()" class="px-2.5 py-1.5 rounded-xl text-[11px] font-bold border transition ${
            state.settings.readaptationMode
              ? 'bg-amber-500/15 border-amber-500/40 text-amber-300'
              : 'bg-emerald-500/15 border-emerald-500/40 text-emerald-300'
          }">
            ${state.settings.readaptationMode ? '⚡ Readaptación' : '📈 Progresión'}
          </button>
        `;
      }
    }

    function renderNav() {
      ['train', 'progress', 'weight', 'settings'].forEach(t => {
        const btn = document.getElementById(`nav-${t}`);
        if (!btn) return;
        if (state.ui.activeTab === t) {
          btn.classList.remove('text-slate-400');
          btn.classList.add('text-cyan-400', 'bg-cyan-500/10');
        } else {
          btn.classList.remove('text-cyan-400', 'bg-cyan-500/10');
          btn.classList.add('text-slate-400');
        }
      });
    }

    function openDayPreviewModal(dayId) {
      const day = state.routines.find(r => r.id === dayId);
      if (!day) return;
      openModal(`
        <div class="flex items-center justify-between mb-3">
          <div>
            <h3 class="text-lg font-extrabold text-white">${escapeHtml(day.name)}</h3>
            <p class="text-xs text-slate-400">${escapeHtml(day.focus)}</p>
          </div>
          <button onclick="closeModal()" class="p-2 rounded-xl bg-surface-800 text-slate-400">✕</button>
        </div>
        ${Array.isArray(day.warmup) && day.warmup.length ? `
          <div class="mb-4 p-3 rounded-2xl bg-amber-500/10 border border-amber-500/25">
            <p class="text-[11px] font-extrabold uppercase tracking-wider text-amber-300 mb-2">🔥 Calentamiento del día (5–7 min)</p>
            <ul class="space-y-1.5">
              ${day.warmup.map(w => `
                <li class="text-xs text-slate-200 flex items-start justify-between gap-2">
                  <span>• ${escapeHtml(w.name)}</span>
                  <span class="text-[11px] font-bold text-amber-200 shrink-0">${escapeHtml(w.target)}</span>
                </li>
              `).join('')}
            </ul>
          </div>
        ` : ''}
        <div class="divide-y divide-slate-800/80 mb-4">
          ${day.exercises.map((ex, idx) => `
            <div class="py-3 flex items-center justify-between gap-2">
              <div class="min-w-0">
                <div class="flex items-center gap-1.5">
                  ${ex.superset ? `<span class="text-[10px] px-1.5 py-0.5 rounded bg-cyan-500/20 text-cyan-300 font-bold">${ex.superset}</span>` : ''}
                  <p class="text-sm font-bold text-slate-100 truncate">${escapeHtml(ex.name)}</p>
                </div>
                <p class="text-xs text-slate-400 mt-0.5">
                  ${ex.sets} × ${ex.minReps === ex.maxReps ? ex.minReps : ex.minReps + '-' + ex.maxReps} reps ${ex.note ? '(' + ex.note + ')' : ''} • Descanso ${formatTime(ex.restSec)}
                </p>
              </div>
              <div class="flex items-center gap-1.5 shrink-0">
                <button onclick="openTechniqueModal('${escapeJs(ex.name)}')" class="px-2.5 py-1.5 rounded-xl bg-cyan-500/15 hover:bg-cyan-500/25 border border-cyan-500/30 text-[11px] font-bold text-cyan-300">
                  ▶
                </button>
                <button onclick="openSwapExerciseModal(${idx}, 'routine', '${day.id}')" class="px-2.5 py-1.5 rounded-xl bg-surface-800 hover:bg-surface-700 text-[11px] font-bold text-slate-300">
                  ↻ Cambiar
                </button>
              </div>
            </div>
          `).join('')}
        </div>
        <button onclick="closeModal(); startWorkout('${day.id}')" class="w-full py-3.5 rounded-2xl bg-cyan-600 hover:bg-cyan-500 text-white font-extrabold text-sm">
          ▶ Iniciar ${escapeHtml(day.name)}
        </button>
      `);
    }

    // --- VISTA 1A: SELECCIONAR DÍA PARA ENTRENAR ---
    function renderStartWorkoutView() {
      const nextDayIndex = state.history.length > 0
        ? (state.routines.findIndex(r => r.id === state.history[0].dayId) + 1) % state.routines.length
        : 0;
      const suggestedDay = state.routines[nextDayIndex] || state.routines[0];
      const currentBW = getCurrentBodyWeight();

      return `
        <div class="space-y-4">
          <!-- Banner de Modo Readaptación / Progresión -->
          <div class="p-4 rounded-2xl border ${
            state.settings.readaptationMode
              ? 'bg-amber-500/10 border-amber-500/30'
              : 'bg-cyan-500/10 border-cyan-500/30'
          } flex items-start justify-between gap-3">
            <div>
              <div class="flex items-center gap-2">
                <span class="text-sm font-extrabold ${state.settings.readaptationMode ? 'text-amber-300' : 'text-cyan-300'}">
                  ${state.settings.readaptationMode ? 'Modo Readaptación Activo (Semanas 1-2)' : 'Modo Doble Progresión Activo'}
                </span>
              </div>
              <p class="text-xs text-slate-300 mt-1 leading-relaxed">
                ${state.settings.readaptationMode
                  ? 'RIR objetivo 2-3 y cargas conservadoras (70-80%) para recuperar tu base sin destruirte con agujetas.'
                  : 'Sugerencias automáticas de peso, repeticiones y sobrecarga (chaleco/pausa/banda) al llegar a 24 kg.'}
              </p>
            </div>
            <button onclick="toggleReadaptationMode()" class="shrink-0 px-3 py-1.5 rounded-xl bg-surface-900 border border-slate-700 text-[11px] font-bold text-white">
              Cambiar
            </button>
          </div>

          <!-- Tarjeta Destacada: Próximo Entrenamiento Sugerido -->
          <div class="p-5 rounded-3xl bg-gradient-to-br from-cyan-600/20 via-surface-900 to-surface-900 border border-cyan-500/40 shadow-xl">
            <div class="flex items-center justify-between mb-2">
              <span class="px-2.5 py-1 rounded-full bg-cyan-500/20 text-cyan-300 text-[11px] font-bold uppercase tracking-wider">
                Siguiente recomendado
              </span>
              <span class="text-xs font-semibold text-slate-400">Meta ~60 min • ${currentBW.toFixed(1)} kg</span>
            </div>
            <h2 class="text-xl font-extrabold text-white">${escapeHtml(suggestedDay.name)}</h2>
            <p class="text-xs text-slate-300 mt-1 mb-4">${escapeHtml(suggestedDay.focus)} • ${suggestedDay.exercises.length} ejercicios</p>
            <div class="flex gap-2">
              <button onclick="startWorkout('${suggestedDay.id}')" class="flex-1 py-3.5 rounded-2xl bg-cyan-600 hover:bg-cyan-500 text-white font-extrabold text-sm shadow-lg shadow-cyan-600/25 active:scale-[0.99] transition">
                ▶ Iniciar Entrenamiento
              </button>
              <button onclick="openDayPreviewModal('${suggestedDay.id}')" class="px-4 py-3.5 rounded-2xl bg-surface-800 hover:bg-surface-700 text-slate-200 font-bold text-xs transition">
                Ver / Rotar
              </button>
            </div>
          </div>

          <!-- Lista de los 4 Días -->
          <div>
            <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2.5 px-1">Tu rutina de 4 días en casa</h3>
            <div class="space-y-2.5">
              ${state.routines.map(r => {
                const lastDone = state.history.find(h => h.dayId === r.id);
                return `
                  <div class="p-4 rounded-2xl bg-surface-900 border border-slate-800 hover:border-slate-700 transition flex items-center justify-between gap-2">
                    <div class="min-w-0">
                      <div class="flex items-center gap-2">
                        <span class="text-sm font-bold text-white truncate">${escapeHtml(r.name)}</span>
                        <span class="text-[10px] px-2 py-0.5 rounded-md bg-surface-800 text-slate-400 font-semibold">${r.recommendedDay}</span>
                      </div>
                      <p class="text-xs text-slate-400 mt-0.5 truncate">${escapeHtml(r.focus)}</p>
                      <p class="text-[11px] text-slate-500 mt-1">
                        ${lastDone ? 'Última vez: ' + formatDateShort(lastDone.date) : 'Sin sesiones previas'}
                      </p>
                    </div>
                    <div class="flex items-center gap-1.5 shrink-0">
                      <button onclick="openDayPreviewModal('${r.id}')" class="px-3 py-2.5 rounded-xl bg-surface-800 hover:bg-surface-700 text-slate-300 text-xs font-bold transition">
                        Ver
                      </button>
                      <button onclick="startWorkout('${r.id}')" class="px-3.5 py-2.5 rounded-xl bg-cyan-600/20 hover:bg-cyan-600 text-cyan-300 hover:text-white border border-cyan-500/30 text-xs font-bold transition active:scale-95">
                        Iniciar
                      </button>
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          </div>

          <!-- Acceso rápido a prueba de temporizador/notificaciones -->
          <div class="p-4 rounded-2xl bg-surface-900/70 border border-slate-800/80 flex items-center justify-between gap-3">
            <div>
              <p class="text-xs font-bold text-slate-200">Temporizador y Alertas</p>
              <p class="text-[11px] text-slate-400">Auto-descanso: ${state.settings.autoRest ? 'Sí' : 'No'} • Sonido: ${state.settings.soundEnabled ? 'Sí' : 'No'}</p>
            </div>
            <button onclick="startRestTimer(15, 'Prueba de descanso')" class="px-3 py-2 rounded-xl bg-surface-800 text-cyan-300 text-xs font-bold">
              Probar 15s
            </button>
          </div>
        </div>
      `;
    }

    // --- VISTA 1B: ENTRENAMIENTO EN VIVO ---
    function renderActiveWorkoutView() {
      const aw = state.activeWorkout;
      const currentBW = getCurrentBodyWeight();

      // Asegurar calentamiento si la sesión activa se inició antes de esta actualización
      if (!Array.isArray(aw.warmup)) {
        const matchedRoutine = state.routines.find(r => r.id === aw.dayId);
        aw.warmup = matchedRoutine && Array.isArray(matchedRoutine.warmup)
          ? matchedRoutine.warmup.map(w => ({ ...w, done: false }))
          : [];
      }
      const warmupTotal = aw.warmup.length;
      const warmupDone = aw.warmup.filter(w => w.done).length;
      const allWarmupDone = warmupTotal > 0 && warmupDone === warmupTotal;

      const warmupCardHtml = warmupTotal > 0 ? `
        <section class="rounded-3xl bg-surface-900 border ${allWarmupDone ? 'border-emerald-500/40' : 'border-amber-500/35'} overflow-hidden shadow-lg">
          <div onclick="toggleWarmupCollapse()" class="p-4 cursor-pointer flex items-center justify-between gap-3 ${allWarmupDone ? 'bg-emerald-500/10' : 'bg-amber-500/10'}">
            <div class="min-w-0">
              <div class="flex items-center gap-2">
                <span class="text-sm font-extrabold ${allWarmupDone ? 'text-emerald-300' : 'text-amber-300'}">
                  ${allWarmupDone ? '✓ Calentamiento completado' : '🔥 Calentamiento del Día (5–7 min)'}
                </span>
                <span class="px-2 py-0.5 rounded-md text-[10px] font-extrabold tabular-nums ${allWarmupDone ? 'bg-emerald-500/20 text-emerald-300' : 'bg-amber-500/20 text-amber-200'}">
                  ${warmupDone}/${warmupTotal}
                </span>
              </div>
              <p class="text-[11px] text-slate-300 mt-0.5">Hombros, codos y articulaciones clave antes de cargar peso</p>
            </div>
            <span class="text-xs font-bold text-slate-300 shrink-0">${aw.warmupCollapsed ? 'Mostrar ▼' : 'Ocultar ▲'}</span>
          </div>

          ${!aw.warmupCollapsed ? `
            <div class="p-3 space-y-2 border-t border-slate-800/80">
              ${aw.warmup.map((w, wIdx) => `
                <div class="p-3 rounded-2xl border transition flex items-start justify-between gap-2.5 ${
                  w.done
                    ? 'bg-emerald-500/10 border-emerald-500/30'
                    : 'bg-surface-950/60 border-slate-800/80'
                }">
                  <button
                    onclick="toggleWarmupItem(${wIdx})"
                    aria-label="Completar calentamiento"
                    class="w-7 h-7 mt-0.5 rounded-xl shrink-0 flex items-center justify-center font-extrabold text-xs transition active:scale-90 ${
                      w.done
                        ? 'bg-emerald-500 text-slate-950'
                        : 'bg-surface-800 text-slate-400 border border-slate-700'
                    }"
                  >
                    ✓
                  </button>
                  <div class="flex-1 min-w-0">
                    <div class="flex flex-wrap items-center gap-1.5">
                      <p class="text-xs font-bold ${w.done ? 'text-slate-400 line-through' : 'text-white'}">${escapeHtml(w.name)}</p>
                      <span class="px-1.5 py-0.5 rounded bg-surface-800 text-[10px] font-bold text-amber-300">${escapeHtml(w.target)}</span>
                    </div>
                    <p class="text-[11px] text-slate-400 mt-0.5 leading-snug">${escapeHtml(w.tip)}</p>
                  </div>
                  <div class="flex items-center gap-1 shrink-0">
                    <button
                      onclick="openTechniqueModal('${escapeJs(w.name)}')"
                      title="Ver técnica"
                      class="px-2 py-1.5 rounded-xl bg-cyan-500/15 hover:bg-cyan-500/25 border border-cyan-500/30 text-[10px] font-bold text-cyan-300"
                    >
                      ▶
                    </button>
                    <button
                      onclick="startRestTimer(${w.timerSec || 45}, 'Calentamiento: ${escapeJs(w.name)}')"
                      class="px-2 py-1.5 rounded-xl bg-surface-800 hover:bg-surface-700 text-[10px] font-bold text-cyan-300"
                    >
                      ⏱ ${w.timerSec || 45}s
                    </button>
                  </div>
                </div>
              `).join('')}

              ${!allWarmupDone ? `
                <div class="pt-1 flex justify-end">
                  <button onclick="completeAllWarmup()" class="px-3 py-1.5 rounded-xl bg-surface-800 hover:bg-surface-700 text-[11px] font-bold text-emerald-300">
                    ✓ Marcar todo listo y ocultar
                  </button>
                </div>
              ` : ''}
            </div>
          ` : ''}
        </section>
      ` : '';

      return `
        <div class="space-y-4">
          <!-- Aviso rápido de modo -->
          ${state.settings.readaptationMode ? `
            <div class="px-3.5 py-2.5 rounded-2xl bg-amber-500/10 border border-amber-500/30 flex items-center justify-between gap-2">
              <span class="text-xs font-semibold text-amber-300">⚡ Readaptación activa: mantén RIR 2-3 hoy.</span>
              <button onclick="toggleReadaptationMode()" class="text-[11px] font-bold text-amber-200 underline">Desactivar</button>
            </div>
          ` : ''}

          <!-- Bloque de Calentamiento Específico del Día -->
          ${warmupCardHtml}

          ${aw.exercises.map((ex, exIdx) => {
            const rec = calculateRecommendation(ex);
            const last = getLastExerciseLog(ex.name);
            const isTutRunning = tutTimer.active && tutTimer.exerciseIdx === exIdx;

            // Integración de peso corporal para ejercicios de peso corporal (Dominadas)
            let bodyweightBadgeHtml = '';
            if (ex.equipment === 'bodyweight') {
              const maxAdded = Math.max(0, ...ex.sets.map(s => (Number(s.weight) || 0) + (s.mods?.vest ? 10 : 0)));
              const totalEstimated = currentBW + maxAdded;
              bodyweightBadgeHtml = `
                <div class="mt-2.5 px-3 py-2 rounded-xl bg-cyan-500/10 border border-cyan-500/30 flex items-center justify-between gap-2 text-[11px]">
                  <span class="text-cyan-200 font-semibold">⚖️ Carga total est. (Peso corporal + lastre)</span>
                  <span class="text-emerald-300 font-extrabold tabular-nums">${totalEstimated.toFixed(1)} kg <span class="text-slate-400 font-medium">(${currentBW.toFixed(1)} + ${maxAdded.toFixed(1)})</span></span>
                </div>
              `;
            }

            const badgeColors = {
              emerald: 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30',
              indigo: 'bg-cyan-500/15 text-cyan-300 border-cyan-500/30',
              amber: 'bg-amber-500/15 text-amber-300 border-amber-500/30',
              rose: 'bg-rose-500/15 text-rose-300 border-rose-500/30'
            };

            const lastSummary = last && last.sets.length
              ? last.sets.map(s => `${s.weight || 0}kg×${s.reps}${s.rir !== '' ? '@R' + s.rir : ''}`).join(' • ')
              : 'Sin registro previo';

            return `
              <section class="rounded-3xl bg-surface-900 border ${ex.superset ? 'border-cyan-500/40' : 'border-slate-800'} overflow-hidden shadow-lg">
                <!-- Cabecera de Tarjeta de Ejercicio -->
                <div class="p-4 border-b border-slate-800/80">
                  <div class="flex items-start justify-between gap-2">
                    <div class="min-w-0">
                      <div class="flex flex-wrap items-center gap-1.5 mb-1">
                        ${ex.superset ? `<span class="px-2 py-0.5 rounded-md bg-cyan-500/20 text-cyan-300 text-[10px] font-extrabold uppercase">${ex.superset}</span>` : ''}
                        <span class="px-2 py-0.5 rounded-md border text-[10px] font-bold ${badgeColors[rec.badgeColor] || badgeColors.indigo}">
                          ${rec.badge}
                        </span>
                        ${ex.note ? `<span class="text-[10px] text-slate-400 font-medium">• ${ex.note}</span>` : ''}
                      </div>
                      <h3 class="text-base font-extrabold text-white leading-snug">${escapeHtml(ex.name)}</h3>
                    </div>

                    <div class="flex items-center gap-1.5 shrink-0">
                      <button onclick="openTechniqueModal('${escapeJs(ex.name)}')" class="px-2.5 py-1.5 rounded-xl bg-cyan-500/15 hover:bg-cyan-500/25 border border-cyan-500/30 text-[11px] font-bold text-cyan-300 transition">
                        ▶ Técnica
                      </button>
                      <button onclick="openSwapExerciseModal(${exIdx}, 'active')" class="px-2.5 py-1.5 rounded-xl bg-surface-800 hover:bg-surface-700 text-[11px] font-bold text-slate-300 transition">
                        ↻ Cambiar
                      </button>
                    </div>
                  </div>

                  ${bodyweightBadgeHtml}

                  <!-- Barra de tiempos del ejercicio (Descanso + TUT) -->
                  <div class="flex flex-wrap items-center gap-2 mt-3">
                    <button onclick="openEditRestModal(${exIdx})" class="px-2.5 py-1.5 rounded-xl bg-surface-800 hover:bg-surface-700 text-[11px] font-semibold text-cyan-300 flex items-center gap-1.5">
                      <span>⏱ Descanso: ${formatTime(ex.restSec)}</span>
                    </button>
                    <button onclick="startRestTimer(${ex.restSec}, '${escapeJs(ex.name)}')" class="px-2.5 py-1.5 rounded-xl bg-cyan-600/20 hover:bg-cyan-600/30 border border-cyan-500/30 text-[11px] font-bold text-cyan-200">
                      ▶ Iniciar descanso
                    </button>
                    <button onclick="toggleTutTimer(${exIdx})" class="px-2.5 py-1.5 rounded-xl ${isTutRunning ? 'bg-rose-500/20 border border-rose-500/40 text-rose-300' : 'bg-surface-800 text-slate-300'} text-[11px] font-semibold flex items-center gap-1">
                      <span>${isTutRunning ? '⏹ Parar serie:' : '⚡ Crono serie'}</span>
                      <span id="tut-display-${exIdx}" class="tabular-nums font-bold">${isTutRunning ? tutTimer.elapsedSec + 's' : (ex.tutSeconds ? ex.tutSeconds + 's' : '')}</span>
                    </button>
                  </div>

                  <!-- Meta recomendada de hoy y Última sesión -->
                  <div class="mt-3 p-3 rounded-2xl bg-surface-950/70 border border-slate-800/80 space-y-1">
                    <div class="flex items-start justify-between gap-2 text-xs">
                      <span class="text-slate-400 font-medium shrink-0">Meta hoy:</span>
                      <span class="text-emerald-300 font-bold text-right">${escapeHtml(rec.summary)}</span>
                    </div>
                    <p class="text-[11px] text-slate-400 leading-snug">${escapeHtml(rec.detail)}</p>
                    <div class="pt-1.5 mt-1.5 border-t border-slate-800/70 flex items-center justify-between gap-2 text-[11px]">
                      <span class="text-slate-500 shrink-0">Última vez:</span>
                      <span class="text-slate-300 truncate">${escapeHtml(lastSummary)}</span>
                    </div>
                  </div>
                </div>

                <!-- Tabla de Series -->
                <div class="p-3 space-y-2">
                  <div class="grid grid-cols-12 gap-1.5 px-2 text-[10px] font-bold uppercase tracking-wider text-slate-400">
                    <div class="col-span-1 text-center">#</div>
                    <div class="col-span-3 text-center">${ex.equipment === 'bodyweight' ? 'Lastre (kg)' : 'Peso (kg)'}</div>
                    <div class="col-span-3 text-center">Reps</div>
                    <div class="col-span-3 text-center">RIR</div>
                    <div class="col-span-2 text-center">Listo</div>
                  </div>

                  ${ex.sets.map((s, setIdx) => {
                    const mods = s.mods || {};
                    return `
                      <div class="rounded-2xl p-2 border transition ${
                        s.done
                          ? 'bg-emerald-500/10 border-emerald-500/35'
                          : 'bg-surface-950/60 border-slate-800/80'
                      }">
                        <div class="grid grid-cols-12 gap-1.5 items-center">
                          <div class="col-span-1 text-center text-xs font-extrabold ${s.done ? 'text-emerald-400' : 'text-slate-400'}">
                            ${setIdx + 1}
                          </div>
                          <div class="col-span-3">
                            <input
                              type="number"
                              inputmode="decimal"
                              step="0.5"
                              min="0"
                              value="${s.weight}"
                              onchange="updateSetField(${exIdx}, ${setIdx}, 'weight', this.value)"
                              placeholder="0"
                              class="w-full text-center bg-surface-900 border border-slate-700 rounded-xl py-2 text-sm font-bold text-white tabular-nums focus:outline-none focus:border-cyan-500"
                            />
                          </div>
                          <div class="col-span-3">
                            <input
                              type="number"
                              inputmode="numeric"
                              min="0"
                              value="${s.reps}"
                              onchange="updateSetField(${exIdx}, ${setIdx}, 'reps', this.value)"
                              placeholder="0"

    /**
     * Genera la gráfica SVG responsiva de evolución del peso corporal con línea de tendencia lineal.
     */
    function buildBodyWeightChartSVG(sortedDesc) {
      if (!sortedDesc || sortedDesc.length === 0) {
        return `<div class="py-8 text-center text-xs text-slate-400">Registra tu primer peso para visualizar la gráfica.</div>`;
      }

      // Cronológico (más antiguo -> más reciente), últimos 20 registros para claridad
      const points = [...sortedDesc].reverse().slice(-20);
      const width = 500;
      const height = 190;
      const padX = 42;
      const padY = 26;

      const weights = points.map(p => Number(p.weight));
      const rawMax = Math.max(...weights);
      const rawMin = Math.min(...weights);
      const maxVal = Math.ceil((rawMax + 0.5) * 10) / 10;
      const minVal = Math.floor((rawMin - 0.5) * 10) / 10;
      const range = Math.max(0.5, maxVal - minVal);

      const coords = points.map((p, idx) => {
        const x = points.length === 1
          ? width / 2
          : padX + (idx / (points.length - 1)) * (width - padX * 2);
        const y = height - padY - ((Number(p.weight) - minVal) / range) * (height - padY * 2);
        return { x, y, weight: Number(p.weight), date: formatDateShort(p.date + 'T12:00:00') };
      });

      // Cálculo de regresión lineal para la línea de tendencia
      let trendLineSvg = '';
      if (coords.length >= 2) {
        const n = coords.length;
        let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
        coords.forEach((c, i) => {
          sumX += i;
          sumY += c.weight;
          sumXY += i * c.weight;
          sumXX += i * i;
        });
        const denom = (n * sumXX - sumX * sumX) || 1;
        const slope = (n * sumXY - sumX * sumY) / denom;
        const intercept = (sumY - slope * sumX) / n;

        const yStartVal = intercept;
        const yEndVal = intercept + slope * (n - 1);
        const y1 = height - padY - ((yStartVal - minVal) / range) * (height - padY * 2);
        const y2 = height - padY - ((yEndVal - minVal) / range) * (height - padY * 2);

        trendLineSvg = `<line x1="${coords[0].x}" y1="${y1}" x2="${coords[n - 1].x}" y2="${y2}" stroke="#10b981" stroke-width="2" stroke-dasharray="6 5" opacity="0.85" />`;
      }

      const polylinePoints = coords.map(c => `${c.x},${c.y}`).join(' ');

      return `
        <div class="w-full overflow-hidden rounded-2xl bg-surface-950/70 border border-slate-800/80 p-3">
          <svg viewBox="0 0 ${width} ${height}" class="w-full h-48 overflow-visible">
            <!-- Guías horizontales -->
            <line x1="${padX}" y1="${padY}" x2="${width - padX}" y2="${padY}" stroke="#1e293b" stroke-dasharray="4 4" />
            <line x1="${padX}" y1="${height / 2}" x2="${width - padX}" y2="${height / 2}" stroke="#1e293b" stroke-dasharray="4 4" />
            <line x1="${padX}" y1="${height - padY}" x2="${width - padX}" y2="${height - padY}" stroke="#1e293b" />

            <!-- Etiquetas Y -->
            <text x="4" y="${padY + 4}" fill="#64748b" font-size="11" font-weight="600">${maxVal.toFixed(1)}</text>
            <text x="4" y="${height / 2 + 4}" fill="#64748b" font-size="11" font-weight="600">${((maxVal + minVal) / 2).toFixed(1)}</text>
            <text x="4" y="${height - padY + 4}" fill="#64748b" font-size="11" font-weight="600">${minVal.toFixed(1)}</text>

            <!-- Línea de tendencia -->
            ${trendLineSvg}

            <!-- Línea de peso -->
            ${coords.length > 1 ? `<polyline fill="none" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${polylinePoints}" />` : ''}

            <!-- Puntos -->
            ${coords.map((c, idx) => {
              const showLabel = coords.length <= 8 || idx === 0 || idx === coords.length - 1 || idx % Math.ceil(coords.length / 6) === 0;
              return `
                <g>
                  <circle cx="${c.x}" cy="${c.y}" r="5.5" fill="#10b981" stroke="#070b14" stroke-width="2">
                    <title>${c.date}: ${c.weight.toFixed(1)} kg</title>
                  </circle>
                  ${showLabel ? `<text x="${c.x}" y="${c.y - 10}" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="700">${c.weight.toFixed(1)}</text>` : ''}
                  ${showLabel ? `<text x="${c.x}" y="${height - 4}" text-anchor="middle" fill="#94a3b8" font-size="10">${c.date}</text>` : ''}
                </g>
              `;
            }).join('')}
          </svg>
          <div class="flex items-center justify-between text-[11px] text-slate-400 mt-1 px-1">
            <span>Mínimo: <b class="text-emerald-400">${rawMin.toFixed(1)} kg</b></span>
            <span>Máximo: <b class="text-cyan-300">${rawMax.toFixed(1)} kg</b></span>
          </div>
        </div>
      `;
    }

    /**
     * Genera una gráfica SVG limpia y responsiva con la evolución del ejercicio.
     */
    function buildExerciseChartSVG(exerciseName, metric) {
      // Extraer puntos cronológicos (de más antiguo a más reciente)
      const points = [];
      for (let i = state.history.length - 1; i >= 0; i--) {
        const h = state.history[i];
        const ex = (h.exercises || []).find(e => e.name === exerciseName && e.sets.length > 0);
        if (!ex) continue;

        let val = 0;
        if (metric === 'maxWeight') {
          val = Math.max(...ex.sets.map(s => (Number(s.weight) || 0) + (s.mods?.vest ? 10 : 0)));
        } else if (metric === 'e1rm') {
          // Fórmula de Epley: w * (1 + reps/30)
          val = Math.max(...ex.sets.map(s => {
            const w = (Number(s.weight) || 0) + (s.mods?.vest ? 10 : 0);
            const r = Number(s.reps) || 1;
            return Math.round(w * (1 + r / 30));
          }));
        } else {
          val = Math.round(ex.sets.reduce((acc, s) => acc + ((Number(s.weight) || 0) + (s.mods?.vest ? 10 : 0)) * (Number(s.reps) || 0), 0));
        }

        points.push({ date: formatDateShort(h.date), val });
      }

      if (points.length === 0) {
        return `<div class="py-8 text-center text-xs text-slate-400">Sin datos suficientes.</div>`;
      }

      const width = 500;
      const height = 180;
      const padX = 36;
      const padY = 24;
      const maxVal = Math.max(...points.map(p => p.val), 1);
      const minVal = Math.min(...points.map(p => p.val), 0);
      const range = Math.max(1, maxVal - minVal);

      const coords = points.map((p, idx) => {
        const x = points.length === 1
          ? width / 2
          : padX + (idx / (points.length - 1)) * (width - padX * 2);
        const y = height - padY - ((p.val - minVal) / range) * (height - padY * 2);
        return { x, y, ...p };
      });

      const polylinePoints = coords.map(c => `${c.x},${c.y}`).join(' ');
      const unit = metric === 'volume' ? 'kg vol' : 'kg';

      return `
        <div class="w-full overflow-hidden rounded-2xl bg-surface-950/70 border border-slate-800/80 p-3">
          <svg viewBox="0 0 ${width} ${height}" class="w-full h-44 overflow-visible">
            <!-- Líneas horizontales guía -->
            <line x1="${padX}" y1="${padY}" x2="${width - padX}" y2="${padY}" stroke="#1e293b" stroke-dasharray="4 4" />
            <line x1="${padX}" y1="${height / 2}" x2="${width - padX}" y2="${height / 2}" stroke="#1e293b" stroke-dasharray="4 4" />
            <line x1="${padX}" y1="${height - padY}" x2="${width - padX}" y2="${height - padY}" stroke="#1e293b" />

            <!-- Etiquetas Y -->
            <text x="4" y="${padY + 4}" fill="#64748b" font-size="11" font-weight="600">${maxVal}</text>
            <text x="4" y="${height - padY + 4}" fill="#64748b" font-size="11" font-weight="600">${minVal}</text>

            <!-- Línea de progreso -->
            ${coords.length > 1 ? `<polyline fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" points="${polylinePoints}" />` : ''}

            <!-- Puntos -->
            ${coords.map(c => `
              <g>
                <circle cx="${c.x}" cy="${c.y}" r="5.5" fill="#10b981" stroke="#070b14" stroke-width="2" />
                <text x="${c.x}" y="${c.y - 10}" text-anchor="middle" fill="#e2e8f0" font-size="11" font-weight="700">${c.val}</text>
                <text x="${c.x}" y="${height - 4}" text-anchor="middle" fill="#94a3b8" font-size="10">${c.date}</text>
              </g>
            `).join('')}
          </svg>
          <div class="flex items-center justify-between text-[11px] text-slate-400 mt-1 px-1">
            <span>Sesiones registradas: <b class="text-white">${points.length}</b></span>
            <span>Mejor marca: <b class="text-emerald-400">${maxVal} ${unit}</b></span>
          </div>
        </div>
      `;
    }

    function calculateWeeklyStreak() {
      const sevenDaysAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;

    // -------------------------------------------------------------------------
    // 12. EXPORTAR / IMPORTAR RESPALDO JSON Y REINICIO
    // -------------------------------------------------------------------------
    function exportBackupJSON() {
      try {
        const dataStr = JSON.stringify(state, null, 2);
        const blob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `alphahome_respaldo_${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('Respaldo JSON descargado.', 'success');
      } catch (e) {
        showToast('Error al exportar respaldo.', 'error');
      }
    }

    function importBackupJSON(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (!parsed || !Array.isArray(parsed.routines)) {
            throw new Error('Formato inválido');
          }
          const defState = getDefaultState();
          const importedRoutines = (Array.isArray(parsed.routines) ? parsed.routines : defState.routines).map(r => {
            const defMatch = defState.routines.find(d => d.id === r.id);
            return {
              ...r,
              warmup: Array.isArray(r.warmup) && r.warmup.length ? r.warmup : (defMatch ? defMatch.warmup : [])
            };
          });
          state = { ...defState, ...parsed, routines: importedRoutines };
          syncWakeLock();
          saveState();
          showToast('Respaldo importado correctamente.', 'success');
          render();
        } catch (err) {
          showToast('El archivo JSON no es válido.', 'error');
        }
      };
      reader.readAsText(file);
      event.target.value = '';
    }
