    function resolveExerciseGuide(name) {
      if (EXERCISE_GUIDES[name]) return EXERCISE_GUIDES[name];
      const n = (name || '').toLowerCase();
      if (n.includes('búlgara') || n.includes('bulgara') || n.includes('zancada')) return EXERCISE_GUIDES['Sentadilla Búlgara en Banco'];
      if (n.includes('inclinado') && (n.includes('press') || n.includes('flexion'))) return EXERCISE_GUIDES['Press Inclinado con Mancuernas'];
      if (n.includes('press plano') || n.includes('flexion') || n.includes('press cerrado')) return EXERCISE_GUIDES['Press Plano con Mancuernas'];
      if (n.includes('militar') || n.includes('arnold') || n.includes('wall slide')) return EXERCISE_GUIDES['Press Militar Sentado en Banco'];
      if (n.includes('supina')) return EXERCISE_GUIDES['Dominadas Supinas en Barra'];
      if (n.includes('dominada') || n.includes('colgada')) return EXERCISE_GUIDES['Dominadas Pronas/Neutras en Barra'];
      if (n.includes('serrucho') || n.includes('un brazo') && n.includes('remo')) return EXERCISE_GUIDES['Remo Serrucho a un Brazo en Banco'];
      if (n.includes('remo')) return EXERCISE_GUIDES['Remo Pecho Apoyado en Banco'];
      if (n.includes('lateral')) return EXERCISE_GUIDES['Elevaciones Laterales con Mancuerna'];
      if (n.includes('face pull') || n.includes('rotación externa') || n.includes('pull-apart') || n.includes('dislocac') || n.includes('escapular')) return EXERCISE_GUIDES['Face Pull con Banda en Barra'];
      if (n.includes('pájaro') || n.includes('pajaro')) return EXERCISE_GUIDES['Pájaros Sentado en Banco'];
      if (n.includes('apertura') && n.includes('banda')) return EXERCISE_GUIDES['Aperturas con Banda de Resistencia'];
      if (n.includes('apertura')) return EXERCISE_GUIDES['Aperturas Inclinadas con Mancuernas'];
      if (n.includes('martillo') || n.includes('zottman')) return EXERCISE_GUIDES['Curl Martillo con Mancuernas'];
      if (n.includes('curl') && !n.includes('femoral')) return EXERCISE_GUIDES['Curl Inclinado en Banco 45°'];
      if (n.includes('francés') || n.includes('frances') || n.includes('copa') || n.includes('cabeza')) return EXERCISE_GUIDES['Press Francés con Mancuernas en Banco'];
      if (n.includes('tríceps') || n.includes('triceps') || n.includes('codo')) return EXERCISE_GUIDES['Extensión de Tríceps con Banda en Barra'];
      if (n.includes('rumano') || n.includes('bisagra') || n.includes('good morning')) return EXERCISE_GUIDES['Peso Muerto Rumano con Mancuernas'];
      if (n.includes('hip thrust') || n.includes('glúteo') || n.includes('gluteo') || n.includes('femoral')) return EXERCISE_GUIDES['Hip Thrust en Banco con Mancuernas'];
      if (n.includes('sentadilla') || n.includes('goblet') || n.includes('tobillo')) return EXERCISE_GUIDES['Sentadilla Goblet Talones Elevados'];
      return {
        archetype: 'incline_press',
        views: ['Lateral', 'Frontal', 'Superior'],
        muscles: 'Técnica controlada y rango completo',
        cues: [
          ['Postura', 'Mantén la columna neutra, escápulas estables y base firme antes de iniciar.'],
          ['Recorrido', 'Controla 2 segundos la fase excéntrica y sube con potencia sin perder técnica.'],
          ['Error común', 'Usar impulso excesivo o acortar el rango de movimiento por cargar demasiado peso.']
        ]
      };
    }

    // Cinemática Inversa (2 huesos) para articulaciones realistas sin deformación
    function solveIK(x0, y0, tx, ty, L1, L2, bendDir = 1) {
      const dx = tx - x0;
      const dy = ty - y0;
      const rawDist = Math.hypot(dx, dy) || 0.001;
      const minDist = Math.abs(L1 - L2) + 0.5;
      const maxDist = L1 + L2 - 0.5;
      const d = Math.max(minDist, Math.min(maxDist, rawDist));
      const baseAngle = Math.atan2(dy, dx);
      const cosA = Math.max(-1, Math.min(1, (L1 * L1 + d * d - L2 * L2) / (2 * L1 * d)));
      const angleA = Math.acos(cosA);
      const jointAngle = baseAngle + bendDir * angleA;
      return {
        jx: x0 + Math.cos(jointAngle) * L1,
        jy: y0 + Math.sin(jointAngle) * L1,
        ex: x0 + (dx / rawDist) * d,
        ey: y0 + (dy / rawDist) * d
      };
    }

    function lerp(a, b, t) { return a + (b - a) * t; }

    function toggleTechPlay() {
      techAnim.playing = !techAnim.playing;
      const btn = document.getElementById('tech-play-btn');
      if (btn) btn.textContent = techAnim.playing ? '⏸ Pausar' : '▶ Reproducir';
      if (techAnim.playing) {
        techAnim.startTime = performance.now() - techAnim.pausedPhase * (3600 / techAnim.speed);
        startTechniqueAnim();
      } else {
        stopTechniqueAnim();
      }
    }

    function toggleTechSpeed() {
      techAnim.speed = techAnim.speed === 1 ? 0.5 : 1;
      const btn = document.getElementById('tech-speed-btn');
      if (btn) btn.textContent = `Vel: ${techAnim.speed.toFixed(1)}x`;
      if (techAnim.playing) {
        techAnim.startTime = performance.now() - techAnim.pausedPhase * (3600 / techAnim.speed);
      }
    }

    function toggleTechGuides() {
      techAnim.showGuides = !techAnim.showGuides;
      const btn = document.getElementById('tech-guides-btn');
      if (btn) btn.textContent = techAnim.showGuides ? 'Guías: Sí' : 'Guías: No';
      renderTechFrame(techAnim.pausedPhase);
    }

    function startTechniqueAnim() {
      stopTechniqueAnim();
      const loop = (now) => {
        if (!document.getElementById('tech-svg-stage')) {
          stopTechniqueAnim();
          return;
        }
        const cycleMs = 3600 / techAnim.speed;
        const phase = ((now - techAnim.startTime) % cycleMs) / cycleMs; // 0..1
        techAnim.pausedPhase = phase;
        renderTechFrame(phase);
        if (techAnim.playing) {
          techAnim.rafId = requestAnimationFrame(loop);
        }
      };
      techAnim.rafId = requestAnimationFrame(loop);
    }

    function stopTechniqueAnim() {
      if (techAnim.rafId) {
        cancelAnimationFrame(techAnim.rafId);
        techAnim.rafId = null;
      }
    }

    // Convierte phase (0..1) en progreso suave p (0 = inicio, 1 = punto máximo, 0 = retorno) con micro-pausas
    function getSmoothProgress(phase) {
      let p = 0;
      let label = 'Inicio';
      if (phase < 0.08) {
        p = 0; label = 'Posición inicial';
      } else if (phase < 0.46) {
        const u = (phase - 0.08) / 0.38;
        p = 0.5 - 0.5 * Math.cos(u * Math.PI);
        label = 'Fase activa';
      } else if (phase < 0.58) {
        p = 1; label = 'Pausa / Contracción';
      } else if (phase < 0.94) {
        const u = (phase - 0.58) / 0.36;
        p = 0.5 + 0.5 * Math.cos(u * Math.PI);
        label = 'Control / Retorno';
      } else {
        p = 0; label = 'Posición inicial';
      }
      return { p, label };
    }

            <stop offset="0%" stop-color="#10b981" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>

        </defs>
        <rect width="320" height="220" fill="#070b14"/>
        <rect width="320" height="220" fill="url(#ah-grid)"/>

    function drawDumbbell(x, y, angleDeg = 0, scale = 1) {
      return `

    function drawJoint(x, y, r = 4, fill = '#e2e8f0') {
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="${fill}" stroke="#070b14" stroke-width="1.5"/>`;

    function drawLimb(x1, y1, x2, y2, w = 8, color = '#cbd5e1') {
      return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${color}" stroke-width="${w}" stroke-linecap="round"/>`;
    }

    function drawGlow(x, y, r = 18) {
      return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${r}" fill="url(#ah-glow)"/>`;
    }

    function renderTechFrame(phase) {
      const svg = document.getElementById('tech-svg-stage');
      if (!svg) return;
      const { p, label } = getSmoothProgress(phase);
      const badge = document.getElementById('tech-phase-badge');
      if (badge) badge.textContent = label;

      const v = techAnim.viewIndex;
      const g = techAnim.showGuides;
      const arch = techAnim.archetype;
      let content = svgBgGrid();

      // =====================================================================
      // 1. SENTADILLA BÚLGARA EN BANCO (IK REAL + EMPEINE PLANO EN EL BANCO)
      // =====================================================================
      if (arch === 'bulgarian') {
        if (v === 0) {
          // VISTA LATERAL CON CINEMÁTICA INVERSA REAL
          const floorY = 198;
          const benchTopY = 148;
          const benchEdgeX = 116;
          const frontAnkle = { x: 220, y: 190 };
          const backAnkle = { x: 114, y: 144 }; // Exactamente sobre el borde superior del banco

          const hx = lerp(176, 168, p);
          const hy = lerp(112, 150, p);
          const shx = hx + lerp(6, 12, p); // Ligera inclinación del torso hacia adelante
          const shy = hy - 48;

          const fLeg = solveIK(hx, hy, frontAnkle.x, frontAnkle.y, 48, 48, -1);
          const bLeg = solveIK(hx, hy, backAnkle.x, backAnkle.y, 48, 48, -1);

          // Suelo y banco realista
          content += `<line x1="20" y1="${floorY}" x2="300" y2="${floorY}" stroke="#334155" stroke-width="2"/>`;
          // Banco (lado izquierdo)
          content += `<rect x="44" y="${benchTopY}" width="${benchEdgeX - 44}" height="12" rx="4" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>`;
          content += `<line x1="56" y1="${benchTopY + 12}" x2="52" y2="${floorY}" stroke="#475569" stroke-width="4" stroke-linecap="round"/>`;
          content += `<line x1="${benchEdgeX - 12}" y1="${benchTopY + 12}" x2="${benchEdgeX - 8}" y2="${floorY}" stroke="#475569" stroke-width="4" stroke-linecap="round"/>`;

          if (g) {
            // Línea vertical de descenso de cadera + guía de empeine
            content += `<line x1="${hx.toFixed(1)}" y1="95" x2="${hx.toFixed(1)}" y2="195" stroke="#22d3ee" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.65"/>`;
            content += `<text x="52" y="${benchTopY - 8}" fill="#38bdf8" font-size="9" font-weight="700">Empeine plano</text>`;
            content += `<text x="200" y="182" fill="#10b981" font-size="9" font-weight="700">Pie firme</text>`;
          }

          // Pierna trasera (empeine apoyado plano sobre el banco, dedos hacia atrás)
          content += drawLimb(hx, hy, bLeg.jx, bLeg.jy, 8, '#64748b');
          content += drawLimb(bLeg.jx, bLeg.jy, backAnkle.x, backAnkle.y, 7, '#64748b');
          // Pie trasero (empeine sobre y=benchTopY, apuntando hacia atrás/izquierda)
          content += `<path d="M ${backAnkle.x} ${backAnkle.y} L ${backAnkle.x - 24} ${benchTopY - 1} L ${backAnkle.x - 22} ${benchTopY - 6} L ${backAnkle.x - 2} ${backAnkle.y - 4} Z" fill="#94a3b8"/>`;

            content += drawDumbbell(hx + 2, hy - 8, 0, 0.9);
            if (g) {
              content += `<line x1="114" y1="138" x2="220" y2="138" stroke="#10b981" stroke-width="1.2" stroke-dasharray="4 3"/>`;
              content += `<text x="150" y="114" fill="#10b981" font-size="9" font-weight="700">Espinilla vertical arriba</text>`;
            }
          } else {
            const lift = lerp(0, 26, p);
            content += `<rect x="96" y="136" width="128" height="16" rx="5" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>`;
            content += drawGlow(160, 128 - lift, 24);
            content += `<rect x="134" y="${116 - lift}" width="52" height="24" rx="10" fill="#e2e8f0"/>`;
            content += drawLimb(144, 136 - lift, 144, 194, 9.5, '#cbd5e1');
            content += drawLimb(176, 136 - lift, 176, 194, 9.5, '#cbd5e1');
            content += drawDumbbell(160, 112 - lift, 0, 0.95);
            if (g) content += `<text x="104" y="42" fill="#10b981" font-size="9.5" font-weight="700">Rodillas firmes sin cerrarse</text>`;
          }
        }
      }

      svg.innerHTML = content;
    }

    function closeModal() {
      stopTechniqueAnim();
      document.getElementById('modal-backdrop').classList.add('hidden');
    }

    // Cerrar modal al tocar fuera
    document.getElementById('modal-backdrop').addEventListener('click', (e) => {
      if (e.target.id === 'modal-backdrop') closeModal();
    });

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const colors = {
        success: 'bg-emerald-500 text-slate-950',
        error: 'bg-rose-500 text-white',
        warning: 'bg-amber-400 text-slate-950',
        info: 'bg-indigo-600 text-white'
      };
      const el = document.createElement('div');
      el.className = `px-4 py-2.5 rounded-2xl text-xs font-bold shadow-xl text-center transition-all duration-300 ${colors[type] || colors.info}`;
      el.textContent = message;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-8px)';
        setTimeout(() => el.remove(), 300);
      }, 2600);
    }

    function formatTime(totalSec) {
      const s = Math.max(0, Math.floor(totalSec));
      const m = Math.floor(s / 60);
      const rem = s % 60;
      return `${String(m).padStart(2, '0')}:${String(rem).padStart(2, '0')}`;
    }

    function formatDateShort(isoStr) {
      try {
        const d = new Date(isoStr);
        return d.toLocaleDateString('es-MX', { day: '2-digit', month: 'short' });
      } catch (e) {
        return '';
      }
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function escapeJs(str) {
      return String(str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
    }

    // -------------------------------------------------------------------------
    // 14. PWA: MANIFEST ESTÁTICO, SERVICE WORKER E INSTALACIÓN
    // -------------------------------------------------------------------------
    let swRegistration = null;
    let appUpdateReady = false;
    const SW_RELOAD_FLAG = 'alphahome_sw_reload';

    function isRunningStandalone() {
      try {
        return window.matchMedia('(display-mode: standalone)').matches
          || window.matchMedia('(display-mode: fullscreen)').matches
          || window.navigator.standalone === true;
      } catch (e) {
        return false;
      }
    }

    function isIosDevice() {
      try {
        const ua = window.navigator.userAgent || '';
        const iOS = /iPad|iPhone|iPod/.test(ua);
        const iPadOS = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
        return iOS || iPadOS;
      } catch (e) {
        return false;
      }
    }

    function renderInstallCard() {
      const installed = isRunningStandalone();
      let action = '';
      if (installed) {
        action = '<p class="text-xs text-emerald-300 font-semibold">AlphaHome ya está instalada en este dispositivo.</p>';
      } else if (deferredInstallPrompt) {
        action = `
          <button id="btn-instalar-app" type="button" onclick="triggerPwaInstall()" class="w-full py-3 rounded-2xl bg-cyan-600 hover:bg-cyan-500 text-white font-extrabold text-xs shadow-lg shadow-cyan-600/20 transition">
            Instalar app
          </button>`;
      } else if (isIosDevice()) {
        action = '<p class="text-xs text-slate-300">En iPhone: <b>Compartir &gt; Agregar a inicio</b>.</p>';
      } else {
        action = '<p class="text-xs text-slate-400">En Chrome: menú <b>⋮ → Agregar a pantalla principal</b>.</p>';
      }

      return `
        <div class="p-4 rounded-3xl bg-surface-900 border border-slate-800 space-y-3">
          <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">App en tu Teléfono</h3>
          <div class="flex items-center gap-3">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-cyan-500 to-blue-600 flex items-center justify-center shadow-lg shadow-cyan-500/20 shrink-0 border border-cyan-400/30">
              <svg class="w-7 h-7 text-white" fill="currentColor" viewBox="0 0 24 24">
                <path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/>
              </svg>
            </div>
            <div class="min-w-0">
              <p class="text-sm font-bold text-white">Instálala y úsala sin conexión</p>
              <p class="text-xs text-slate-400 mt-0.5">Después de la primera visita funciona a pantalla completa, también sin internet.</p>
            </div>
          </div>
          ${action}
        </div>`;
    }

    function showAppUpdateToast(worker) {
      const container = document.getElementById('toast-container');
      if (!container || !worker || document.getElementById('sw-update-toast')) return;
      const el = document.createElement('button');
      el.id = 'sw-update-toast';
      el.type = 'button';
      el.className = 'pointer-events-auto px-4 py-2.5 rounded-2xl text-xs font-bold shadow-xl text-center bg-cyan-600 text-white';
      el.textContent = 'Nueva versión disponible, recargar';
      el.addEventListener('click', () => requestSwActivation(worker));
      container.appendChild(el);
    }

    function requestSwActivation(worker) {
      if (!worker) return;
      appUpdateReady = true;
      try { sessionStorage.setItem(SW_RELOAD_FLAG, '1'); } catch (e) {}
      try { worker.postMessage({ type: 'SKIP_WAITING' }); } catch (e) {}
    }

    function navigationWasReload() {
      try {
        const nav = performance.getEntriesByType('navigation')[0];
        return !!(nav && nav.type === 'reload');
      } catch (e) {
        return false;
      }
    }

    function watchServiceWorker(reg) {
      swRegistration = reg;
      const waiting = reg.waiting;
      if (waiting && navigator.serviceWorker.controller) {
        if (navigationWasReload()) requestSwActivation(waiting);
        else showAppUpdateToast(waiting);
      }
      reg.addEventListener('updatefound', () => {
        const worker = reg.installing;
        if (!worker) return;
        worker.addEventListener('statechange', () => {
          if (worker.state === 'installed' && navigator.serviceWorker.controller) {
            showAppUpdateToast(worker);
          }
        });
      });
    }

    function registerServiceWorker() {
      if (!('serviceWorker' in navigator)) return;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        let pending = appUpdateReady;
        try {
          if (sessionStorage.getItem(SW_RELOAD_FLAG) === '1') pending = true;
          sessionStorage.removeItem(SW_RELOAD_FLAG);
        } catch (e) {}
        if (!pending) return;
        window.location.reload();
      });
      navigator.serviceWorker.register('./sw.js', { scope: './', updateViaCache: 'none' })
        .then((reg) => {
          watchServiceWorker(reg);
        })
        .catch((err) => {
          console.warn('No se pudo registrar el service worker:', err);
        });
    }

    function triggerPwaInstall() {
      const promptEvent = deferredInstallPrompt;
      if (!promptEvent) return;
      deferredInstallPrompt = null;
      const finish = () => {
        if (state.ui.activeTab === 'settings') render();
      };
      try {
        const result = promptEvent.prompt();
        if (promptEvent.userChoice && typeof promptEvent.userChoice.then === 'function') {
          promptEvent.userChoice.then(finish).catch(finish);
        } else if (result && typeof result.then === 'function') {
          result.then(finish).catch(finish);
        } else {
          finish();
        }
      } catch (e) {
        finish();
      }
    }

    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      if (isRunningStandalone()) return;
      deferredInstallPrompt = e;
      if (state.ui.activeTab === 'settings') render();
    });

    window.addEventListener('appinstalled', () => {
      deferredInstallPrompt = null;
      if (state.ui.activeTab === 'settings') render();
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && swRegistration && swRegistration.update) {
        swRegistration.update().catch(() => {});
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      registerServiceWorker();
      if (state.activeWorkout) startSessionTicker();
      syncWakeLock();
      render();
    });
  </script>
</body>
